[tool.poetry]
name = "ymain"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.13.0"
babel = {version = "2.10.3", markers = "python_version >= \"3.11\""}
chardet = {version = "5.2.0", markers = "python_version >= \"3.11\""}
cryptography = {version = "42.0.8", markers = "python_version >= \"3.12\""}
decorator = {version = "5.1.1", markers = "python_version >= \"3.11\""}
docutils = {version = "0.20.1", markers = "python_version >= \"3.11\""}
ebaysdk = "2.1.5"
freezegun = {version = "1.2.1", markers = "python_version >= \"3.11\""}
geoip2 = "2.9.0"
gevent = {version = "24.2.1", markers = "sys_platform != \"win32\" and python_version >= \"3.12\""}
greenlet = {version = "3.0.3", markers = "sys_platform != \"win32\" and python_version >= \"3.12\""}
idna = {version = "3.6", markers = "python_version >= \"3.12\""}
jinja2 = {version = "3.1.2", markers = "python_version > \"3.10\""}
libsass = {version = "0.22.0", markers = "python_version >= \"3.11\""}
lxml = {version = "5.2.1", markers = "python_version >= \"3.12\""}
lxml-html-clean = {markers = "python_version >= \"3.12\"", version = "^0.4.1"}
markupsafe = {version = "2.1.5", markers = "python_version >= \"3.12\""}
num2words = {version = "0.5.13", markers = "python_version >= \"3.12\""}
ofxparse = "0.21"
passlib = "1.7.4"
pillow = {version = "10.2.0", markers = "python_version >= \"3.12\""}
polib = "1.1.1"
psutil = {version = "5.9.8", markers = "python_version >= \"3.12\""}
psycopg2 = {version = "2.9.9", markers = "python_version >= \"3.12\""}
pydot = "1.4.2"
pyopenssl = {version = "24.1.0", markers = "python_version >= \"3.12\""}
pypdf2 = {version = "2.12.1", markers = "python_version > \"3.10\""}
pypiwin32 = {markers = "sys_platform == \"win32\"", version = "^223"}
pyserial = "3.5"
python-dateutil = {version = "2.8.2", markers = "python_version >= \"3.11\""}
python-ldap = {version = "3.4.4", markers = "sys_platform != \"win32\" and python_version >= \"3.12\""}
python-stdnum = {version = "1.19", markers = "python_version >= \"3.11\""}
pytz = "^2024.2"
pyusb = "1.2.1"
qrcode = {version = "7.4.2", markers = "python_version >= \"3.11\""}
reportlab = {version = "4.1.0", markers = "python_version >= \"3.12\""}
requests = {version = "2.31.0", markers = "python_version >= \"3.11\""}
rjsmin = {version = "1.2.0", markers = "python_version >= \"3.11\""}
rl-renderpm = {version = "4.0.3", markers = "sys_platform == \"win32\" and python_version >= \"3.12\""}
urllib3 = {version = "2.0.7", markers = "python_version >= \"3.12\""}
vobject = "0.9.6.1"
werkzeug = {version = "3.0.1", markers = "python_version >= \"3.12\""}
xlrd = {version = "2.0.1", markers = "python_version >= \"3.12\""}
xlsxwriter = {version = "3.1.9", markers = "python_version >= \"3.12\""}
xlwt = "1.3.0"
zeep = {version = "4.2.1", markers = "python_version >= \"3.11\""}
pandas = "^2.2.3"
inotify = "^0.2.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
